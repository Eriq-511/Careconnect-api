version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: Careconnect
      POSTGRES_USER: neondb_owner
      POSTGRES_PASSWORD: npg_KvRW0MAiLkN8
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  api:
    build: ./careconnect-api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      - db
      - redis
volumes:
  pgdata: